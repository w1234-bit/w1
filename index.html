<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>峡谷之战 · 5v5 推塔大战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ============ 开始 / 选英雄界面 ============ -->
    <section id="startScreen" class="screen">
      <div class="start-glow"></div>
      <div class="start-inner">
        <div class="logo">
          <div class="logo-sub">5V5 · 推塔大战</div>
          <h1>峡 谷 之 战</h1>
          <div class="logo-line"></div>
          <p class="logo-desc">选择你的英雄，带领队伍摧毁敌方水晶！</p>
        </div>

        <div class="hero-select" id="heroSelect">
          <!-- 由 JS 填充英雄卡片 -->
        </div>

        <div class="start-actions">
          <button id="startBtn" class="btn-main">进 入 峡 谷</button>
          <p class="tips">提示： WASD / 方向键移动 · 空格普攻 · Q E R 释放技能 · B 回城</p>
        </div>
      </div>
    </section>

    <!-- ============ 游戏界面 ============ -->
    <section id="gameScreen" class="screen hidden">
      <div class="battle-wrap">
        <canvas id="gameCanvas" width="1120" height="760"></canvas>

        <!-- 顶部比分条 -->
        <div class="score-bar">
          <div class="team-score blue">
            <span class="team-name">我方</span>
            <span class="kill-num" id="blueKills">0</span>
          </div>
          <div class="game-time" id="gameTime">00:00</div>
          <div class="team-score red">
            <span class="kill-num" id="redKills">0</span>
            <span class="team-name">敌方</span>
          </div>
        </div>

        <!-- 击杀播报 -->
        <div class="kill-feed" id="killFeed"></div>

        <!-- 小地图 -->
        <div class="minimap-wrap">
          <div class="minimap-title">峡谷地图</div>
          <canvas id="minimap" width="180" height="122"></canvas>
        </div>

        <!-- 底部 HUD -->
        <div class="hud">
          <div class="hud-left">
            <div class="portrait" id="portrait">
              <span id="portraitIcon">英</span>
              <div class="level-badge" id="levelBadge">1</div>
            </div>
            <div class="stat-bars">
              <div class="hp-bar-outer">
                <div class="hp-bar-fill" id="hpBarFill"></div>
                <span class="bar-text" id="hpText">100 / 100</span>
              </div>
              <div class="mp-bar-outer">
                <div class="mp-bar-fill" id="mpBarFill"></div>
                <span class="bar-text" id="mpText">100 / 100</span>
              </div>
              <div class="exp-bar-outer">
                <div class="exp-bar-fill" id="expBarFill"></div>
              </div>
            </div>
          </div>

          <div class="hud-center">
            <div class="skill-slot" id="skillSlot0">
              <div class="skill-icon">普攻</div>
              <div class="skill-key">空格</div>
              <div class="cooldown-mask"></div>
            </div>
            <div class="skill-slot" id="skillSlot1">
              <div class="skill-icon" id="skillIcon1">Q</div>
              <div class="skill-key">Q</div>
              <div class="cooldown-mask"></div>
              <div class="cd-text"></div>
            </div>
            <div class="skill-slot" id="skillSlot2">
              <div class="skill-icon" id="skillIcon2">E</div>
              <div class="skill-key">E</div>
              <div class="cooldown-mask"></div>
              <div class="cd-text"></div>
            </div>
            <div class="skill-slot ultimate" id="skillSlot3">
              <div class="skill-icon" id="skillIcon3">R</div>
              <div class="skill-key">R</div>
              <div class="cooldown-mask"></div>
              <div class="cd-text"></div>
            </div>
          </div>

          <div class="hud-right">
            <div class="gold-box"><span class="coin">●</span> <span id="goldText">0</span></div>
            <button class="shop-btn" id="shopBtn">装备商店 <small>B</small></button>
            <div class="recall-status" id="recallStatus"></div>
          </div>
        </div>

        <!-- 装备商店面板 -->
        <div class="shop-panel hidden" id="shopPanel">
          <div class="shop-header">
            <span>⚔ 装备商店</span>
            <button id="shopClose">✕</button>
          </div>
          <div class="shop-items" id="shopItems"></div>
        </div>

        <!-- 操作提示 -->
        <div class="control-hint" id="controlHint">
          <b>WASD</b> 移动　<b>空格</b> 普攻　<b>Q/E/R</b> 技能　<b>B</b> 回城　<b>P</b> 暂停
          <button id="closeHint">知道了</button>
        </div>

        <!-- 暂停遮罩 -->
        <div class="pause-overlay hidden" id="pauseOverlay">
          <h2>游戏暂停</h2>
          <p>按 P 继续战斗</p>
        </div>

        <!-- 结算界面 -->
        <div class="result-overlay hidden" id="resultOverlay">
          <div class="result-card">
            <h1 id="resultTitle">胜利</h1>
            <div class="result-stats" id="resultStats"></div>
            <button class="btn-main" id="restartBtn">再 战 一 局</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
